name: Azure Data Factory CI Pipeline

on:
  push:
    branches:
      - main
      - adf_publish
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate ADF Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout published ARM templates
        uses: actions/checkout@v4
        with:
          ref: adf_publish
          path: published

      - name: Check repository structure
        run: |
          echo "Checking Azure Data Factory project..."

          test -d source/dataset
          test -d source/pipeline
          test -d source/linkedService
          test -d source/factory

          echo "ADF project folders found successfully."

      - name: Check published ARM templates
        run: |
          test -f published/adf-devplatform-2026/ARMTemplateForFactory.json
          test -f published/adf-devplatform-2026/ARMTemplateParametersForFactory.json

          echo "Both ARM template files found successfully."

      - name: Validate ARM template JSON
        run: |
          python -m json.tool \
            published/adf-devplatform-2026/ARMTemplateForFactory.json \
            > /dev/null

          python -m json.tool \
            published/adf-devplatform-2026/ARMTemplateParametersForFactory.json \
            > /dev/null

          echo "Both ARM templates contain valid JSON."
