name: Azure Data Factory CI Pipeline

on:
  push:
    branches:
      - main
      - adf_publish
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate ADF Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          echo "Checking Azure Data Factory project..."

          test -d dataset
          test -d pipeline
          test -d linkedService
          test -d factory

          echo "ADF project folders found successfully."

      - name: Check published ARM templates
        run: |
          if [ -f "adf-devplatform-2026/ARMTemplateForFactory.json" ]; then
            echo "Published ARM template found."
          else
            echo "ARM template not found."
            exit 1
          fi

          if [ -f "adf-devplatform-2026/ARMTemplateParametersForFactory.json" ]; then
            echo "ARM parameters file found."
          else
            echo "ARM parameters file not found."
            exit 1
          fi
